<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Комплектующие - Matoff PC</title>
    <meta name="description" content="Видеокарты, процессоры, оперативная память, SSD в наличии. Доставка по всей России.">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/matoffpc-jpg/matoffpc.github.io/refs/heads/main/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: rgba(22, 22, 28, 0.9);
            --text-primary: #ededee;
            --text-secondary: #bbb;
            --border-color: rgba(155, 77, 255, 0.25);
            --card-bg: rgba(22, 22, 28, 0.85);
            --header-bg: rgba(10, 10, 15, 0.85);
            --promo-bg: linear-gradient(135deg, #9b4dff, #7c3aed);
            --btn-bg: linear-gradient(135deg, #9b4dff, #7c3aed);
            --btn-shadow: #4a1d8a;
            --price-color: #ffaa66;
            --accent-purple: #9b4dff;
            --accent-orange: #e68a2e;
            --input-bg: rgba(31, 31, 40, 0.9);
            --gradient-light: #fff;
            --gradient-dark: #9b4dff;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        .header { background: var(--header-bg); backdrop-filter: blur(10px); position: sticky; top: 0; border-bottom: 1px solid var(--border-color); z-index: 100; padding: 15px 0; }
        .header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo { font-family: 'Orbitron', monospace; font-size: 1.8rem; font-weight: 800; text-decoration: none; }
        .logo-matoff { color: var(--accent-purple); }
        .logo-pc { color: var(--accent-orange); }
        .nav { display: flex; gap: 25px; flex-wrap: wrap; align-items: center; }
        .nav a { color: var(--text-secondary); text-decoration: none; transition: 0.3s; }
        .nav a:hover { color: var(--accent-purple); }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--btn-bg); color: white; font-weight: 700; padding: 12px 24px; border-radius: 50px; border: none; cursor: pointer; text-decoration: none; box-shadow: 0 3px 0 var(--btn-shadow); transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--btn-shadow); }
        
        .section-title { font-family: 'Orbitron', monospace; font-size: 2rem; font-weight: 700; margin-bottom: 40px; text-align: center; }
        .section-title span { background: linear-gradient(120deg, var(--accent-purple), var(--accent-orange)); background-clip: text; -webkit-background-clip: text; color: transparent; }
        
        /* Фильтры */
        .component-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .filter-btn { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px 24px; border-radius: 50px; color: var(--text-primary); cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .filter-btn.active, .filter-btn:hover { background: var(--accent-purple); color: white; }
        
        /* Сетка товаров */
        .components-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        .component-card { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 24px; padding: 20px; border: 1px solid var(--border-color); transition: all 0.3s; display: flex; flex-direction: column; }
        .component-card:hover { border-color: var(--accent-purple); transform: translateY(-5px); }
        .component-image { width: 100%; height: 160px; object-fit: contain; margin-bottom: 15px; border-radius: 12px; background: rgba(0,0,0,0.2); padding: 10px; }
        .component-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
        .component-price { font-size: 1.4rem; font-weight: 800; color: var(--price-color); margin: 8px 0; }
        .component-condition { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; width: fit-content; margin: 5px 0; }
        .component-condition.new { background: rgba(0,200,100,0.2); color: #00c864; }
        .component-condition.good { background: rgba(255,170,68,0.2); color: #ffaa44; }
        .component-condition.excellent { background: rgba(155,77,255,0.2); color: #9b4dff; }
        .component-desc { font-size: 0.75rem; color: var(--text-secondary); margin: 8px 0; line-height: 1.4; flex: 1; }
        .component-card .btn-add-to-cart { margin-top: 12px; width: 100%; padding: 10px; font-size: 0.85rem; }
        
        .cart-badge { position: relative; }
        .cart-count { position: absolute; top: -8px; right: -12px; background: var(--accent-orange); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; }
        
        .cart-bar { text-align: right; margin-bottom: 30px; padding: 15px; background: var(--card-bg); border-radius: 50px; border: 1px solid var(--border-color); }
        
        footer { text-align: center; padding: 30px; border-top: 1px solid var(--border-color); margin-top: 50px; }
        
        @media (max-width: 1000px) { .components-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .components-grid { grid-template-columns: repeat(2, 1fr); } .header .container { flex-direction: column; } }
        @media (max-width: 480px) { .components-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header class="header">
    <div class="container">
        <a href="/" class="logo"><span class="logo-matoff">MATOFF</span><span class="logo-pc"> PC</span></a>
        <div class="nav">
            <a href="/#services">Услуги</a>
            <a href="/#builds">Сборки</a>
            <a href="components.html">Комплектующие</a>
            <a href="/#reviews">Отзывы</a>
            <a href="/#order">Заявка</a>
            <a href="cart.html" class="cart-badge">🛒 Корзина <span id="headerCartCount" class="cart-count">0</span></a>
        </div>
    </div>
</header>

<main>
    <section style="padding: 40px 0 20px 0;">
        <div class="container">
            <h1 class="section-title">Комплектующие <span>в наличии</span></h1>
            <p style="text-align: center; margin-bottom: 30px; color: var(--text-secondary);">
                🛠️ Видеокарты, процессоры, память и SSD — отправка по всей России
            </p>
        </div>
    </section>

    <section>
        <div class="container">
            <div class="cart-bar">
                🛒 <a href="cart.html" style="color: var(--accent-purple);">Перейти в корзину</a> | 
                Товаров: <span id="cartCount">0</span>
            </div>
            
            <div class="component-filters" id="componentFilters">
                <button class="filter-btn active" data-category="all">Все</button>
                <button class="filter-btn" data-category="gpu">🎮 Видеокарты</button>
                <button class="filter-btn" data-category="cpu">🖥️ Процессоры</button>
                <button class="filter-btn" data-category="ram">💾 Оперативная память</button>
                <button class="filter-btn" data-category="ssd">⚡ SSD накопители</button>
            </div>
            
            <div class="components-grid" id="componentsContainer">
                <div style="text-align: center; padding: 50px;">Загрузка комплектующих...</div>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>📍 Мастерская в Нижнем Новгороде | Matoff PC — продажа комплектующих</p>
    <p style="margin-top: 10px; font-size: 12px;">© Matoff PC</p>
</footer>

<script>
    const TELEGRAM_BOT_TOKEN = "8787519466:AAFzHmOnPd7FFmEMzBs8c-NM9O8SQcvu0s0";
    const TELEGRAM_CHAT_ID = "1065465753";
    let siteData = { components: [] };
    
    let cart = JSON.parse(localStorage.getItem('matoff_cart')) || [];
    
    function saveCart() {
        localStorage.setItem('matoff_cart', JSON.stringify(cart));
        updateCartCounters();
    }
    
    function updateCartCounters() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const cartSpans = document.querySelectorAll('#cartCount, #headerCartCount');
        cartSpans.forEach(span => { if (span) span.textContent = totalItems; });
    }
    
    function addToCart(component) {
        const existing = cart.find(item => item.id === component.id);
        if (existing) {
            existing.quantity++;
        } else {
            cart.push({
                id: component.id,
                name: component.name,
                price: component.price,
                priceText: component.priceText,
                image: component.image,
                quantity: 1
            });
        }
        saveCart();
        alert(`✅ ${component.name} добавлен в корзину!`);
    }
    
    async function loadData() {
        try {
            const response = await fetch('/data.json?t=' + Date.now());
            if (response.ok) {
                siteData = await response.json();
                renderComponents();
            } else {
                document.getElementById('componentsContainer').innerHTML = '<div style="text-align:center;padding:50px;">❌ Ошибка загрузки данных</div>';
            }
        } catch(e) {
            console.error('Ошибка:', e);
            document.getElementById('componentsContainer').innerHTML = '<div style="text-align:center;padding:50px;">❌ Ошибка загрузки. Проверьте data.json</div>';
        }
    }
    
    function renderComponents() {
        const container = document.getElementById('componentsContainer');
        if (!container) return;
        
        if (!siteData.components || siteData.components.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:50px;">📦 Комплектующие скоро появятся в наличии</div>';
            return;
        }
        
        const activeFilter = document.querySelector('#componentFilters .filter-btn.active')?.dataset.category || 'all';
        let filtered = [...siteData.components];
        if (activeFilter !== 'all') {
            filtered = filtered.filter(c => c.category === activeFilter);
        }
        
        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:50px;">😕 Нет товаров в этой категории</div>';
            return;
        }
        
        container.innerHTML = filtered.map(c => `
            <div class="component-card">
                <img class="component-image" src="${c.image}" alt="${c.name}" onerror="this.src='https://placehold.co/300x200/2a2a35/9b4dff?text=${encodeURIComponent(c.name)}'">
                <h3>${c.name}</h3>
                <div class="component-price">${c.priceText}</div>
                <div class="component-condition ${c.conditionBadge}">${c.condition}</div>
                <div class="component-desc">${c.description || ''}</div>
                <button class="btn btn-add-to-cart" data-id="${c.id}" data-name="${c.name}" data-price="${c.price}" data-pricetext="${c.priceText}" data-image="${c.image}">📦 Добавить в корзину</button>
            </div>
        `).join('');
        
        document.querySelectorAll('.btn-add-to-cart').forEach(btn => {
            btn.onclick = () => {
                addToCart({
                    id: parseInt(btn.dataset.id),
                    name: btn.dataset.name,
                    price: parseInt(btn.dataset.price),
                    priceText: btn.dataset.pricetext,
                    image: btn.dataset.image
                });
            };
        });
    }
    
    function initFilters() {
        const filters = document.querySelectorAll('#componentFilters .filter-btn');
        filters.forEach(btn => {
            btn.onclick = () => {
                filters.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderComponents();
            };
        });
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        initFilters();
        loadData();
        updateCartCounters();
    });
</script>
</body>
</html>
